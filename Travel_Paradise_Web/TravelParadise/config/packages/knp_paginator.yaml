knp_paginator:
    page_range: 5                 # Nombre de liens de page affichés
    default_options:
        page_name: page           # Nom du paramètre de requête pour le numéro de page
        sort_field_name: sort     # Nom du paramètre de requête pour le champ de tri
        sort_direction_name: direction # Nom du paramètre de requête pour la direction de tri
        distinct: true            # Utiliser DISTINCT dans les requêtes
    template:
        pagination: '@KnpPaginator/Pagination/tailwind_v1.html.twig' # Utilise le template Tailwind
        sortable: '@KnpPaginator/Pagination/sortable_link.html.twig' # Template pour les liens de tri
