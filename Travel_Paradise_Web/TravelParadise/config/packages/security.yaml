security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
        App\Entity\User:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                default_target_path: admin_dashboard
                username_parameter: email
                password_parameter: password
            logout:
                path: app_logout
                target: app_login

    role_hierarchy:
        ROLE_ADMIN: ROLE_USER

    access_control:
        # Accès public
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/logout, roles: PUBLIC_ACCESS }

        # 🛑 Dashboard et gestion utilisateurs = uniquement pour ROLE_ADMIN
        - { path: ^/admin/?$, roles: ROLE_ADMIN }
        - { path: ^/admin/user, roles: ROLE_ADMIN }
        - { path: ^/admin/statistics, roles: ROLE_ADMIN }

        # ✅ Routes accessibles à ROLE_USER (et donc aussi ROLE_ADMIN grâce à la hiérarchie)
        - { path: ^/admin/guide_touristique, roles: ROLE_USER }
        - { path: ^/admin/visite, roles: ROLE_USER }
        - { path: ^/admin/affectation, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
