version: '3.8'

services:
  # Base de données PostgreSQL
  database:
    image: postgres:16
    container_name: travel_paradise_db
    environment:
      POSTGRES_DB: travel_paradise
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - travel_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d travel_paradise"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Application Symfony
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travel_paradise_app
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
      - ./php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      database:
        condition: service_healthy
    networks:
      - travel_network
    environment:
      - DATABASE_URL=postgresql://admin:admin123@database:5432/travel_paradise?serverVersion=16&charset=utf8
      - APP_ENV=dev
      - APP_DEBUG=1
      - PHP_MEMORY_LIMIT=512M
    restart: unless-stopped
    working_dir: /var/www/html

  # Adminer pour gérer la base de données (optionnel)
  adminer:
    image: adminer
    container_name: travel_paradise_adminer
    ports:
      - "8080:8080"
    depends_on:
      - database
    networks:
      - travel_network
    restart: unless-stopped

networks:
  travel_network:
    driver: bridge

volumes:
  postgres_data: